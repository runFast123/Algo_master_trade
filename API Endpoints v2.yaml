  /v2/eod:
    get:
      tags:
        - API Endpoints
      summary: End-of-Day Data
      description: >-
        You can use the API's `eod` endpoint in order to obtain end-of-day data
        for one or multiple stock tickers. A single or multiple comma-separated
        ticker symbols are passed to the API using the `symbols` parameter.
             * 
             * 
             * **Note:**
             * 
             * * *The EOD data has access to over 500,000 tickers from more major world-known exchanges. The full list of supported tickers and exchanges can be seen here:* [**Download**](https://marketstack.com/download/v2_eod_tickers_finnworlds_tiingo.xlsx)
             * 
             * * *A daily updated list of all tickers accessible via Marketstack is available for download:* [**Download Ticker List**](https://marketstack.com/download/supported_tickers_2.csv)
             * 
             * * *The V2 EOD endpoint supports data from **30+ stock exchanges**, including **NASDAQ,** **PINK, SHG, NYSE, NYSE ARCA, OTCQB,** and **BATS***
             * 
             * * *To retrieve end-of-day data for individual tickers, you can also use the Tickers Endpoint.*
             * 
             * * ***Ticker Symbol Formatting:** When querying ticker symbols that include a period (.), replace the period with a hyphen (-) in the intraday endpoint. **Example:BRK.B → BRK-B***
             * * *The **LSE’s/XLON** official currency is **GBP**, however many stocks can be and are quoted in **pence (GBX)** by convention. It improves readability and pricing precision. If **LSE** equity price looks “too big” → it’s probably **pence**. Convert using **GBP = GBX / 100***
             * 
             * **Adjusted Prices:**
             * “**Adjusted**” prices represent stock values that have been modified to accurately reflect the impact of corporate actions such as splits and dividends. These adjustments are applied following the CRSP Calculations methodology established by the **Center for Research in Security Prices (CRSP).**
      operationId: get_eod_v2
      parameters:
        - name: access_key
          in: query
          description: Your API access key, which can be found in your account dashboard.
          required: true
          schema:
            type: string
        - name: symbols
          in: query
          description: >-
            Comma-separated list of one or more stock ticker symbols (required
            for this endpoint). Example: AAPL,MSFT
          required: true
          schema:
            type: string
        - name: exchange
          in: query
          description: >-
            Filter results by stock exchange, identified by its MIC. Example:
            XNAS
          required: false
          schema:
            type: string
        - name: sort
          in: query
          description: Sort order of the results by date.
          required: false
          schema:
            type: string
            default: DESC
            enum:
              - DESC
              - ASC
              - desc
              - asc
        - name: date_from
          in: query
          description: 'Filter results from a specific start date. [Format: YYYY-MM-DD]'
          required: false
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          description: 'Filter results up to a specific end date. [Format: YYYY-MM-DD]'
          required: false
          schema:
            type: string
            format: date
        - name: limit
          in: query
          description: Specify a limit of results to return. Default value is 100.
          required: false
          schema:
            maximum: 1000
            minimum: 1
            type: integer
            default: 100
        - name: offset
          in: query
          description: Specify an offset for pagination. Default offset value is 0.
          required: false
          schema:
            minimum: 0
            type: integer
            default: 0
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EODResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: >-
            Validation error — symbols is required and all parameters must be
            valid.
        '429':
          $ref: '#/components/responses/RateLimitReached'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Maintenance'
