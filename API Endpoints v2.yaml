openapi: 3.0.0
info:
  title: Marketstack
  description: >-
    The marketstack API was built to deliver worldwide stock market data
    (real-time, intraday and historical), together with information on stock
    exchanges, tickers, indices, ETFs, bonds, commodities and company
    fundamentals, in a simple, lightweight JSON format. Requests to the REST API
    are made using a straightforward HTTP GET URL structure. This documentation
    covers the v2 API surface.
  version: 2.0.0
servers:
  - url: https://api.marketstack.com
    description: Production server
security:
  - ApiKeyAuth: []
tags:
  - name: API Endpoints
    description: API Endpoints
paths:
  /v2/exchanges:
    get:
      tags:
        - API Endpoints
      summary: Stock Exchanges
      description: >-
        Using the Exchanges endpoint you will be able to look up information any
        of the 2700+ stock exchanges supported by this endpoint. This endpoint
        provides general information about several stock exchanges. Not all
        stock exchanges found here are supported by other Marketstack endpoints.
        For the supported stock exchanges supported by each endpoint, please
        verify each endpoint documentation.
      operationId: get_stock_exchange_v2
      parameters:
        - name: access_key
          in: query
          description: Your API access key, which can be found in your account dashboard.
          required: true
          schema:
            type: string
        - name: search
          in: query
          description: >-
            Use this parameter to get autocomplete suggestions by specifying a
            search term.
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: Specify a limit of results to return. Default value is 100.
          required: false
          schema:
            maximum: 1000
            minimum: 1
            type: integer
            default: 100
        - name: offset
          in: query
          description: Specify an offset for pagination. Default offset value is 0.
          required: false
          schema:
            minimum: 0
            type: integer
            default: 0
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Validation error — one or more parameters are invalid.
        '429':
          $ref: '#/components/responses/RateLimitReached'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Maintenance'
  /v2/exchanges/{mic}:
    get:
      tags:
        - API Endpoints
      summary: Stock Exchange by MIC
      description: Returns detailed information for a single exchange (by MIC).
      operationId: get_stock_exchange_show_v2
      parameters:
        - name: access_key
          in: query
          description: Your API access key, which can be found in your account dashboard.
          required: true
          schema:
            type: string
        - name: mic
          in: path
          description: Market Identifier Code (MIC) of the stock exchange.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Validation error — one or more parameters are invalid.
        '429':
          $ref: '#/components/responses/RateLimitReached'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Maintenance'
  /v2/exchanges/{mic}/eod:
    get:
      tags:
        - API Endpoints
      summary: Exchange End-of-Day Data
      description: Returns EOD data for all symbols on a specific exchange.
      operationId: get_stock_exchange_eod_v2
      parameters:
        - name: access_key
          in: query
          description: Your API access key, which can be found in your account dashboard.
          required: true
          schema:
            type: string
        - name: mic
          in: path
          description: Market Identifier Code (MIC) of the stock exchange.
          required: true
          schema:
            type: string
        - name: symbols
          in: query
          description: >-
            Comma-separated list of one or more stock ticker symbols (required
            for this endpoint). Example: AAPL,MSFT
          required: true
          schema:
            type: string
        - name: sort
          in: query
          description: Sort order of the results by date.
          required: false
          schema:
            type: string
            default: DESC
            enum:
              - DESC
              - ASC
              - desc
              - asc
        - name: date_from
          in: query
          description: 'Filter results from a specific start date. [Format: YYYY-MM-DD]'
          required: false
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          description: 'Filter results up to a specific end date. [Format: YYYY-MM-DD]'
          required: false
          schema:
            type: string
            format: date
        - name: limit
          in: query
          description: Specify a limit of results to return. Default value is 100.
          required: false
          schema:
            maximum: 1000
            minimum: 1
            type: integer
            default: 100
        - name: offset
          in: query
          description: Specify an offset for pagination. Default offset value is 0.
          required: false
          schema:
            minimum: 0
            type: integer
            default: 0
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangesMicEod'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Validation error — one or more parameters are invalid.
        '429':
          $ref: '#/components/responses/RateLimitReached'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Maintenance'
