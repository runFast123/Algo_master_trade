  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            account_on_hold:
              summary: account_on_hold
              value:
                success: false
                error:
                  code: 107
                  type: account_on_hold
                  info: >-
                    Your account currently has open invoices and API has been
                    automatically disabled. Please settle your open balance or
                    downgrade to the Free Plan to restore API access. [Support:
                    support@apilayer.com]
            invalid_access_key:
              summary: invalid_access_key
              value:
                success: false
                error:
                  code: 101
                  type: invalid_access_key
                  info: >-
                    You have not supplied a valid API Access Key. [Technical
                    Support: support@apilayer.com]
            missing_access_key:
              summary: missing_access_key
              value:
                success: false
                error:
                  code: 101
                  type: missing_access_key
                  info: >-
                    You have not supplied an API Access Key. [Required format:
                    access_key=YOUR_ACCESS_KEY]
            inactive_user:
              summary: inactive_user
              value:
                success: false
                error:
                  code: 102
                  type: inactive_user
                  info: Permission denied - User not active.
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            https_access_restricted:
              summary: https_access_restricted
              value:
                success: false
                error:
                  code: 105
                  type: https_access_restricted
                  info: >-
                    Access Restricted - Your current Subscription Plan does not
                    support HTTPS Encryption.
            function_access_restricted:
              summary: function_access_restricted
              value:
                success: false
                error:
                  code: 105
                  type: function_access_restricted
                  info: >-
                    Access Restricted - Your current Subscription Plan does not
                    support this API Function.
            api_access_blocked:
              summary: api_access_blocked
              value:
                success: false
                error:
                  code: 104
                  type: api_access_blocked
                  info: >-
                    Your API access has been temporarily disabled. Please
                    upgrade your Subscription Plan or contact support.
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            invalid_api_function:
              summary: invalid_api_function
              value:
                success: false
                error:
                  code: 103
                  type: invalid_api_function
                  info: This API Function does not exist.
            404_not_found:
              summary: 404_not_found
              value:
                success: false
                error:
                  code: 404
                  type: 404_not_found
                  info: >-
                    404 - The requested resource could not be found. Please try
                    again or contact support.
    RateLimitReached:
      description: Too Many Requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            usage_limit_reached:
              summary: usage_limit_reached
              value:
                success: false
                error:
                  code: 104
                  type: usage_limit_reached
                  info: >-
                    Your monthly usage limit has been reached. Please upgrade
                    your Subscription Plan.
            daily_usage_limit_reached:
              summary: daily_usage_limit_reached
              value:
                success: false
                error:
                  code: 104
                  type: daily_usage_limit_reached
                  info: >-
                    Your daily usage limit has been reached. Please try again
                    tomorrow or upgrade your subscription plan.
            fair_use_limit_reached:
              summary: fair_use_limit_reached
              value:
                success: false
                error:
                  code: 104
                  type: fair_use_limit_reached
                  info: >-
                    Your fair use limit has been reached. [Please contact
                    support: support@apilayer.com]
            rate_limit_reached:
              summary: rate_limit_reached
              value:
                success: false
                error:
                  code: 106
                  type: rate_limit_reached
                  info: >-
                    You have exceeded the maximum rate limitation allowed on
                    your subscription plan. Please refer to the "Rate Limits"
                    section of the API Documentation for details. 
    InternalError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            internal_error:
              summary: internal_error
              value:
                success: false
                error:
                  code: 0
                  type: internal_error
                  info: >-
                    An error has occured. [Technical Support:
                    support@apilayer.com]
    Maintenance:
      description: Service Unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            maintenance_mode:
              summary: maintenance_mode
              value:
                success: false
                error:
                  code: 503
                  type: maintenance_mode
                  info: ''
  parameters:
    AccessKey:
      name: access_key
      in: query
      description: Your API access key, which can be found in your account dashboard.
      required: true
      schema:
        type: string
    Symbols:
      name: symbols
      in: query
      description: >-
        Comma-separated list of one or more stock ticker symbols. Example:
        AAPL,MSFT
      required: true
      schema:
        type: string
    SymbolsRequired:
      name: symbols
      in: query
      description: >-
        Comma-separated list of one or more stock ticker symbols (required for
        this endpoint). Example: AAPL,MSFT
      required: true
      schema:
        type: string
    Exchange:
      name: exchange
      in: query
      description: 'Filter results by stock exchange, identified by its MIC. Example: XNAS'
      required: false
      schema:
        type: string
    Sort:
      name: sort
      in: query
      description: Sort order of the results by date.
      required: false
      schema:
        type: string
        default: DESC
        enum:
          - DESC
          - ASC
          - desc
          - asc
    DateFrom:
      name: date_from
      in: query
      description: 'Filter results from a specific start date. [Format: YYYY-MM-DD]'
      required: false
      schema:
        type: string
        format: date
    DateTo:
      name: date_to
      in: query
      description: 'Filter results up to a specific end date. [Format: YYYY-MM-DD]'
      required: false
      schema:
        type: string
        format: date
    Interval:
      name: interval
      in: query
      description: >-
        Intraday data interval. Available values: 1min, 5min, 10min, 15min,
        30min, 1hour, 3hour, 6hour, 12hour, 24hour. Default: 1hour
      required: false
      schema:
        type: string
        default: 1hour
        enum:
          - 1min
          - 5min
          - 10min
          - 15min
          - 30min
          - 1hour
          - 3hour
          - 6hour
          - 12hour
          - 24hour
    AfterHours:
      name: after_hours
