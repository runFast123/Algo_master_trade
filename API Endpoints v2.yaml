  /v2/frames/accounts_payable/{unit}:
    get:
      tags:
        - API Endpoints
      summary: Accounts Payable Frames
      description: >-
        The frames API aggregates one fact for each reporting entity that is the
        last filed that most closely fits the calendrical period requested. This
        API supports annual, quarterly, and instantaneous data. This API
        endpoint is made for the US-GAAP taxonomy and the Accounts Payable
        Current type of the taxonomy.           
             * Where the units of measure specified in the API contain a numerator and a denominator, these are separated by “-per-” such as “USD-per-shares”. Note that the default unit in XBRL is “pure”.           
             * The period format is CY#### for annual data (duration 365 days +/- 30 days), CY####Q# for quarterly data (duration 91 days +/- 30 days), and CY####Q#I for instantaneous data. Because company financial calendars can start and end on any month or day and even change in length from quarter to quarter according to the day of the week, the frame data is assembled by the dates that best align with a calendar quarter or year. Data users should be mindful of the different reporting start and end dates for facts contained in a frame.
      operationId: get_frames_accounts_payable
      parameters:
        - name: access_key
          in: query
          description: Your API access key, which can be found in your account dashboard.
          required: true
          schema:
            type: string
        - name: unit
          in: path
          description: Unit of measure for the frame.
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: Specify a limit of results to return. Default value is 100.
          required: false
          schema:
            maximum: 1000
            minimum: 1
            type: integer
            default: 100
        - name: offset
          in: query
          description: Specify an offset for pagination. Default offset value is 0.
          required: false
          schema:
            minimum: 0
            type: integer
            default: 0
        - name: frame
          in: query
          description: 'Reporting frame. Example: CY2023Q1I.'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrameResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Validation error — one or more parameters are invalid.
        '429':
